
<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Content-type" content="text/html; charset=utf-8">
        <title>DEFRAGMENTER: Clean Up the System!</title>
        
        <!-- ============================================== -->
        <!--        SCRIPTS DE JAVASCRIPT MODULARES         -->
        <!-- ============================================== -->
        
        <!-- 1. LIBRERÍAS DE TERCEROS (LIB) -->
        <script src="lib/jquery.min.js" type="text/javascript" charset="utf-8"></script> 
        
        <!-- 2. MOTOR BASE (ENGINE) -->
        <!-- El polyfill de animación debe cargarse primero para garantizar requestAnimationFrame. -->
        <script src="engine/animation.js" type="text/javascript" charset="utf-8"></script>
        <script src="engine/loader.js" type="text/javascript" charset="utf-8"></script>
        <script src="engine/entity.js" type="text/javascript" charset="utf-8"></script>
        
        <!-- 3. MÓDULOS DEL JUEGO (GAME) -->
        <!-- Los módulos dependientes (levels, mouse) deben definirse antes del objeto principal (game). -->
        <script src="game/Levels.js" type="text/javascript" charset="utf-8"></script>
        <script src="game/mouse.js" type="text/javascript" charset="utf-8"></script>
        <script src="game/Game.js" type="text/javascript" charset="utf-8"></script>
        <script src="game/Audio.js" type="text/javascript"></script>
        
        <!-- 4. PUNTO DE ENTRADA (MAIN) -->
        <!-- main.js debe cargarse al final para asegurarse de que game.init() esté disponible. -->
        <script src="main.js" type="text/javascript" charset="utf-8"></script>

        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css" type="text/css" media="screen" charset="utf-8">
    </head>
    
    <body>
        <div id="gamecontainer">
            <canvas id="gamecanvas" width="640" height="480" class="gamelayer">     
            </canvas>
            
            <div id="scorescreen" class="gamelayer">
                <img id="togglemusic" src="assets/images/icons/sound.png">
                <img src="assets/images/icons/prev.png">
                <span id="score">Score: 0</span>
            </div>
            
            <!-- <div id="gamestartscreen" class="gamelayer">
                <img src="assets/images/icons/play.png" alt="Play Game" onclick = "game.showLevelScreen();"><br>
                <img src="assets/images/icons/settings.png" alt="Settings">
            </div> -->
            
            <div id="gamestartscreen" class="gamelayer active">
                <h1>DEFRAGMENTER:</h1>
                <p>Clean Up the System!</p>
                <button id="start-button">INICIAR JUEGO</button>
                <button id="highscores-button">PUNTUACIONES</button>
                <button id="settings-button">AJUSTES</button>
            </div>

            <div id="levelselectscreen" class="gamelayer">
    
                <h1 id="level-select-title">SELECCIONAR OLEADA:</h1> 
                
                <div id="level-buttons-container">
                    
                    </div>
                
            </div>
            
            <div id="loadingscreen" class="gamelayer">
                <div id="loadingmessage"></div>
            </div>
            
            <div id="endingscreen" class="gamelayer">
                <div>
                    <p id="endingmessage">The Level Is Over Message</p>
                    <p id="playcurrentlevel"><img src="assets/images/icons/prev.png"> Replay Current Level</p>          
                    <p id="playnextlevel"><img src="assets/images/icons/next.png"> Play Next Level </p>               
                    <p id="showLevelScreen"><img src="assets/images/icons/return.png"> Return to Level Screen</p>
                </div>
            </div>  
            
        </div>
    </body>
</html>
